name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium com as bibliotecas do sistema, que vêm dos espelhos do Ubuntu (uns 20 s). Se o runner não alcança os
      # espelhos (aconteceu em 11/11/2026: a instalação travou até o fim do tempo do job), instala só o navegador; a
      # imagem do GitHub já tem as bibliotecas de que ele precisa
      - name: Chromium com as bibliotecas do sistema
        id: chromium
        run: npx playwright install --with-deps chromium
        timeout-minutes: 4
        continue-on-error: true
      - name: Só o Chromium (espelhos do Ubuntu fora do alcance)
        if: steps.chromium.outcome != 'success'
        run: npx playwright install chromium
      - name: Testes unitários (motor, regras, dados)
        run: npm run test:unit
      - name: Testes E2E (Playwright)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: relatorio-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
